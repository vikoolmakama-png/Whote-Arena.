<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login - WHOT Arena</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;min-height:100vh;display:flex;align-items:center;
    justify-content:center;padding:20px;font-family:Arial,sans-serif;
    background:linear-gradient(145deg,#02082b,#071b58,#03102f);color:#fff
}
.box{
    width:100%;max-width:400px;background:rgba(5,20,65,.96);
    border:1px solid #176cff;border-radius:25px;padding:30px 22px;
    box-shadow:0 0 35px rgba(0,100,255,.25);text-align:center
}
.logo{font-size:31px;font-weight:1000;color:#ffd21c}
.arena{font-size:14px;letter-spacing:6px;font-weight:bold}
.subtitle{color:#8fb8ed;margin:12px 0 25px}
input{
    width:100%;padding:16px;margin:7px 0;border-radius:13px;
    border:1px solid #2468d8;background:#071b50;color:white;
    outline:none;font-size:15px
}
button{
    width:100%;padding:16px;margin-top:14px;border:0;border-radius:13px;
    background:linear-gradient(135deg,#ffd21c,#ffad00);
    color:#06143f;font-size:16px;font-weight:900;cursor:pointer
}
.error{
    background:#5d1820;border:1px solid #ff4d5c;color:#ffd9dc;
    padding:10px;border-radius:10px;margin-bottom:12px;font-size:13px
}
.security{margin-top:22px;color:#75d99a;font-size:12px}
</style>
</head>
<body>
<div class="box">
    <div class="logo">WHOT</div>
    <div class="arena">ARENA</div>
    <div class="subtitle">ADMIN CONTROL PANEL</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="Admin username" required>
        <input type="password" name="password" placeholder="Admin password" required>
        <button type="submit">🔐 LOGIN TO ADMIN</button>
    </form>

    <div class="security">🛡 Secure Admin Access</div>
</div>
</body>
</html>
