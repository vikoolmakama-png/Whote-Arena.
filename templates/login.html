<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - WHOT Arena</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #031326;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 18px;
}

.container {
    width: 100%;
    max-width: 430px;
}

.brand {
    text-align: center;
    color: #56a9ff;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 28px;
}

.card {
    background: linear-gradient(145deg, #0b2948, #061a30);
    border: 1px solid #245b8f;
    border-radius: 24px;
    padding: 30px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
}

h1 {
    text-align: center;
    margin: 0 0 8px;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #91a8bf;
    margin: 0 0 25px;
}

label {
    display: block;
    margin: 16px 0 8px;
    font-weight: 700;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #315f89;
    background: #06172a;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #49a4ff;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #2d9bf0, #126bc1);
    color: white;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
}

.message {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
    background: #381b25;
    color: #ffb5c2;
}

.success {
    background: #123521;
    color: #9df0b8;
}

.bottom {
    text-align: center;
    margin-top: 22px;
    color: #91a8bf;
}

.bottom a {
    color: #58adff;
    text-decoration: none;
    font-weight: 800;
}
</style>
</head>

<body>

<div class="container">

    <div class="brand">WHOT ARENA</div>

    <div class="card">

        <h1>Welcome Back</h1>
        <p class="subtitle">Login to your Arena account</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {% if category == 'success' %}success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Phone Number</label>
            <input
                type="tel"
                name="phone"
                placeholder="08012345678"
                maxlength="15"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Your password"
                required
            >

            <button type="submit">LOGIN</button>

        </form>

        <div class="bottom">
            Don't have an account?
            <a href="/register">CREATE ACCOUNT</a>
        </div>

    </div>

</div>

</body>
</html>
